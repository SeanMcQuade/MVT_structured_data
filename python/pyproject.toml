[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvtpy"
version = "0.1.0"
description = "Python implementation of the CIRCLES MegaVanderTest data pipeline, byte-compatible with the MATLAB reference"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "CIRCLES Consortium" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Needed by the later pipeline stages (.mat output and figures), not by the
# JSON encoder, which is pure standard library.
full = [
    "pandas>=2.0",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["mvtpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
