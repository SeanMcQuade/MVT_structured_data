[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvtpy"
version = "0.1.0"
description = "Python implementation of the CIRCLES MegaVanderTest data pipeline, byte-compatible with the MATLAB reference"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "CIRCLES Consortium" }]
# Core runtime: numpy everywhere, pandas for the GPS CSV parsing. Enough to run
# the gps / samples / fields stages of the CLI.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Figures (matplotlib) and reading MATLAB .mat references (scipy v7, h5py v7.3).
full = [
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

[project.scripts]
mvt = "mvtpy.cli:main"

[tool.setuptools.packages.find]
include = ["mvtpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
